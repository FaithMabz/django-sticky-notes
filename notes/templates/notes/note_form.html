{% extends 'notes/base.html' %}

{% block content %}

<div class="form-container">
    <h2>
        {% if form.instance.pk %}
        Edit Note
        {% else %}
        Create New Note 
        {% endif %}
    </h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Save Note
        </button>

        <a href="{% url 'note_list' %}" class="btn">Cancel</a>
    </form>
</div>

{% endblock %}
